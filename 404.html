<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — FrameFolio. The page you're looking for doesn't exist or has been moved.">
  <title>404 — Page Not Found | FrameFolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" style="background:var(--bg-alt);">

<!-- Top Bar -->
<div class="auth-topbar">
  <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
    <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
  </button>
  <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
    <span class="theme-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
  </button>
</div>

<main class="error-page" style="position:relative;">
  <!-- Big 404 background -->
  <div class="error-code" aria-hidden="true">404</div>

  <!-- Logo at top -->
  <div class="error-logo">
    <a href="index.html" aria-label="FrameFolio Home">
      <img src="logo.svg" alt="FrameFolio" width="48" height="48">
      <div style="display:flex;flex-direction:column;line-height:1.1;">
        <span style="font-size:1.05rem;font-weight:700;color:var(--text);font-family:var(--font-serif);">FRAME</span>
        <span style="font-size:0.68rem;font-weight:500;color:var(--secondary);letter-spacing:0.2em;text-transform:uppercase;">FOLIO</span>
      </div>
    </a>
  </div>

  <div class="error-content">
    <div class="error-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/><line x1="7" y1="13" x2="7" y2="13"/><line x1="17" y1="13" x2="17" y2="13"/></svg>
    </div>
    <h1>Shot Not Found</h1>
    <p>The page you're looking for seems to have wandered out of frame. Let's get you back to the directory.</p>
    <div class="error-btns">
      <a href="index.html" class="btn btn-primary btn-lg">Go Home</a>
      <a href="browse.html" class="btn btn-secondary btn-lg">Browse Photographers</a>
    </div>
    <div style="margin-top:2.5rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;">
      <a href="contact.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text-muted)'">Contact Support</a>
      <a href="list-services.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text-muted)'">List Your Services</a>
      <a href="login.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text-muted)'">Sign In</a>
    </div>
  </div>
</main>

<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    initAuthPage();
  });
</script>
</body>
</html>
