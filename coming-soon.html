<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FrameFolio is coming soon. Sign up to be notified when we launch new features.">
  <title>Coming Soon | FrameFolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Top Bar -->
<div class="coming-soon-topbar">
  <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
    <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
  </button>
  <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
    <span class="theme-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
  </button>
</div>

<main class="coming-soon-page">
  <!-- Logo -->
  <div class="coming-soon-logo">
    <a href="index.html" title="Return to Home" aria-label="FrameFolio Home">
      <img src="logo.svg" alt="FrameFolio Logo" width="52" height="52">
      <div style="display:flex;flex-direction:column;line-height:1.1;">
        <span style="font-size:1.1rem;font-weight:700;color:var(--text);font-family:var(--font-serif);">FRAME</span>
        <span style="font-size:0.7rem;font-weight:500;color:var(--secondary);letter-spacing:0.2em;text-transform:uppercase;">FOLIO</span>
      </div>
    </a>
  </div>

  <div class="coming-soon-content">
    <div class="section-badge" style="background:rgba(201,169,110,0.15);border-color:rgba(201,169,110,0.3);margin:0 auto 1.5rem;">New Feature Incoming</div>
    <h1>Something <span>Spectacular</span><br>is Coming</h1>
    <p>We're working hard to bring you an exciting new feature. Be the first to know when it launches — sign up below.</p>

    <!-- Countdown -->
    <div class="countdown">
      <div class="countdown-item">
        <span class="countdown-num" id="cd-days">00</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-hours">00</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-mins">00</span>
        <span class="countdown-label">Minutes</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-secs">00</span>
        <span class="countdown-label">Seconds</span>
      </div>
    </div>

    <!-- Newsletter -->
    <form onsubmit="event.preventDefault(); alert('You\'re on the list! We\'ll notify you at launch.'); this.reset();" class="coming-soon-form" id="notify-form">
      <input type="email" placeholder="Enter your email address" required aria-label="Email address">
      <button type="submit" class="btn btn-primary">Notify Me</button>
    </form>
    <p style="color:var(--text-muted);font-size:0.78rem;margin-top:0.75rem;font-weight:400;">No spam. We promise.</p>

    <!-- Links -->
    <div style="margin-top:2.5rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text-muted)'">← Back to Home</a>
      <a href="browse.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text-muted)'">Browse Photographers</a>
      <a href="contact.html" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text-muted)'">Contact Us</a>
    </div>
  </div>
</main>

<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    initAuthPage();
    // Count to 30 days from now
    const target = new Date();
    target.setDate(target.getDate() + 30);
    initCountdown(target.toISOString());
  });
</script>
</body>
</html>
